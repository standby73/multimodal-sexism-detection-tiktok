[project]
name = "multimodal-sexism-detection"
description = "Multimodal sexism detection in TikTok videos (EXIST 2026, Task 3)"
version = "0.1.0"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["app"]
include = ["src*", "scripts*"]